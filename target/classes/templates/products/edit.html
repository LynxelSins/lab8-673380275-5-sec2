<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ Product Shop — แก้ไขสินค้า</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar-game">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-decoration-none" th:href="@{/products}">
                <i class="bi bi-bag-check-fill me-2"></i>Product Shop
            </a>
            <span class="nav-text">CP353002 — Lab 8</span>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">
                <!-- Page Header -->
                <div class="page-header">
                    <a th:href="@{/products}" class="text-secondary text-decoration-none d-inline-block mb-2" style="font-size: 0.88rem;">
                        <i class="bi bi-arrow-left me-1"></i>กลับไปรายการสินค้า
                    </a>
                    <h1><i class="bi bi-pencil-square me-2"></i>แก้ไขข้อมูลสินค้า</h1>
                    <p class="subtitle">
                        แก้ไขข้อมูลสินค้าและรายละเอียดเสริม:
                        <strong th:text="${product.name}">Product Name</strong>
                    </p>
                </div>

                <!-- Edit Form -->
                <div class="card-glass p-4">
                    <form th:action="@{/products/update/{id}(id=${product.id})}" th:object="${product}" method="post" class="form-game">

                        <!-- ส่วนที่ 1: ข้อมูลสินค้าหลัก (Product Entity) -->
                        <div class="section-title">
                            <i class="bi bi-box-seam me-2"></i>1. ข้อมูลสินค้าหลัก (Product)
                        </div>

                        <!-- Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label">
                                <i class="bi bi-tag me-1"></i>ชื่อสินค้า
                            </label>
                            <input type="text" id="name" th:field="*{name}" class="form-control" required>
                        </div>

                        <!-- Category + Brand -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label">
                                    <i class="bi bi-grid me-1"></i>หมวดหมู่ (Category)
                                </label>
                                <input type="text" id="category" th:field="*{category}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="brand" class="form-label">
                                    <i class="bi bi-award me-1"></i>แบรนด์ (Brand)
                                </label>
                                <input type="text" id="brand" th:field="*{brand}" class="form-control" required>
                            </div>
                        </div>

                        <!-- Price + Stock + Discount Strategy -->
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="price" class="form-label">
                                    <i class="bi bi-currency-exchange me-1"></i>ราคาปกติ (บาท)
                                </label>
                                <input type="number" id="price" th:field="*{price}" class="form-control"
                                       step="0.01" min="0" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="stock" class="form-label">
                                    <i class="bi bi-stack me-1"></i>จำนวนในคลัง (Stock)
                                </label>
                                <input type="number" id="stock" th:field="*{stock}" class="form-control"
                                       min="0" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="discountType" class="form-label">
                                    <i class="bi bi-percent me-1"></i>ส่วนลด (Strategy Pattern)
                                </label>
                                <select id="discountType" th:field="*{discountType}" class="form-select">
                                    <option value="NONE">ราคาปกติ (0%)</option>
                                    <option value="MEMBER">ส่วนลดสมาชิก (ลด 10%)</option>
                                    <option value="SEASONAL">ส่วนลดเทศกาล (ลด 20%)</option>
                                </select>
                            </div>
                        </div>

                        <!-- ส่วนที่ 2: ข้อมูลเสริมสินค้า (ProductDetail Entity - 1:1) -->
                        <div class="section-title mt-4">
                            <i class="bi bi-file-earmark-text me-2"></i>2. ข้อมูลเสริมสินค้า (1:1 ProductDetail)
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label">
                                <i class="bi bi-card-text me-1"></i>รายละเอียดสินค้า (Description)
                            </label>
                            <textarea id="description" th:field="*{detail.description}" class="form-control" rows="3"></textarea>
                        </div>

                        <!-- Warranty + Weight -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="warranty" class="form-label">
                                    <i class="bi bi-shield-check me-1"></i>การรับประกัน (Warranty)
                                </label>
                                <input type="text" id="warranty" th:field="*{detail.warranty}" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="weight" class="form-label">
                                    <i class="bi bi-speedometer2 me-1"></i>น้ำหนัก (Weight in kg)
                                </label>
                                <input type="number" id="weight" th:field="*{detail.weight}" class="form-control"
                                       step="0.001" min="0">
                            </div>
                        </div>

                        <!-- Dimensions + Manufactured Country -->
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3">
                                <label for="dimensions" class="form-label">
                                    <i class="bi bi-bounding-box-circles me-1"></i>ขนาด (Dimensions)
                                </label>
                                <input type="text" id="dimensions" th:field="*{detail.dimensions}" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="manufacturedCountry" class="form-label">
                                    <i class="bi bi-globe me-1"></i>ประเทศที่ผลิต (Manufactured Country)
                                </label>
                                <input type="text" id="manufacturedCountry" th:field="*{detail.manufacturedCountry}" class="form-control">
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="d-flex gap-3 pt-2">
                            <button type="submit" class="btn btn-gold">
                                <i class="bi bi-check-circle me-2"></i>อัปเดตข้อมูล
                            </button>
                            <a th:href="@{/products}" class="btn btn-ghost">
                                <i class="bi bi-x-circle me-2"></i>ยกเลิก
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
